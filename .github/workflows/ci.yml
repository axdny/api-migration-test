name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Run `npm install` once locally and commit package-lock.json to switch this to `npm ci`.
      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run API migration tests (against the bundled mock APIs)
        run: npm test
        env:
          CI: 'true'

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: reports/
